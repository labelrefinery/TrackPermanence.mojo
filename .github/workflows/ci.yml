name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.env == 'default' && 'nightly' || matrix.env }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        env: [default, stable]
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.9.0
        with:
          environments: ${{ matrix.env }}

      - name: Unit tests
        run: pixi run -e ${{ matrix.env }} test

      - name: Inference parity vs PyTorch (trained + random weights)
        run: |
          pixi run -e ${{ matrix.env }} parity | tee parity.log
          test "$(grep -c 'PARITY: PASS' parity.log)" = "2"

      - name: Demo plugin on an AV2 occlusion
        run: |
          pixi run -e ${{ matrix.env }} demo | tee demo.log
          grep -q "2 links -> 40 tracks out" demo.log
