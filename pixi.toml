[workspace]
authors = ["Marius S <39998+winding-lines@users.noreply.github.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "TrackPermanence.mojo"
platforms = ["osx-arm64", "linux-64"]
version = "0.2.0"
preview = ["pixi-build"]

[package]
name = "trackpermanence"
version = "0.2.0"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.*" }

[package.build.config.pkg]
path = "src/trackpermanence"
name = "trackpermanence"

# The pixi-build-mojo backend drives the stable `mojo package` flow, so the
# packaged build pins stable; the source itself also compiles on nightly
# (see [environments] and CI).
[package.host-dependencies]
mojo-compiler = "==1.2.0"

[package.build-dependencies]
mojo-compiler = "==1.2.0"

[package.run-dependencies]
mojo-compiler = ">=1.2.0,<2"

[tasks]
test = "mojo run -I src tests/test_trackpermanence.mojo"
parity = "mojo run -I src src/parity.mojo data/weights.lft data && mojo run -I src src/parity.mojo data/random/weights.lft data/random"
demo = "mojo run -I src src/main.mojo data/weights.lft examples/occluded.csv examples/completed.csv"

[feature.nightly.dependencies]
modular = ">=26.8.0.dev2026102305,<27"

[feature.stable.dependencies]
mojo-compiler = "==1.2.0"

[environments]
default = ["nightly"]
stable = ["stable"]
